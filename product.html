    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #1a202c;
        }
        
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        @keyframes toastIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        
        .toast-enter {
            animation: toastIn 0.3s ease-out forwards;
        }
        
        .toast-exit {
            animation: toastOut 0.3s ease-in forwards;
        }
        
        .heart-active {
            color: #ef4444;
            fill: #ef4444;
        }
        
        .hover-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .hover-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .tab-active {
            border-bottom: 2px solid #2563eb;
            color: #1a202c;
            font-weight: 700;
        }
    </style>
</head>

        let cart = JSON.parse(localStorage.getItem('arngren_cart') || '[]');
        let wishlist = JSON.parse(localStorage.getItem('arngren_wishlist') || '[]');

        function saveCart() {
            localStorage.setItem('arngren_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function saveWishlist() {
            localStorage.setItem('arngren_wishlist', JSON.stringify(wishlist));
        }

        function updateCartBadge() {
            const total = cart.reduce((s, i) => s + i.qty, 0);
            const b = document.getElementById('cart-badge');
            b.textContent = total;
            b.classList.toggle('hidden', total === 0);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                info: 'bg-blue-600'
            };
            const icons = {
                success: 'check-circle',
                error: 'alert-circle',
                info: 'info'
            };
            toast.className = `${colors[type]} text-white px-5 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter min-w-[300px]`;
            toast.innerHTML = `<i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0"></i><span class="text-sm font-medium flex-grow">${message}</span><button onclick="this.parentElement.remove()" class="text-white/70 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>`;
            container.appendChild(toast);
            lucide.createIcons({
                nodes: [toast]
            });
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function addToCart(productId, qty) {
            const p = PRODUCTS.find(pr => pr.id === productId);
            if (!p) return;
            const existing = cart.find(i => i.id === productId);
            if (existing) {
                existing.qty += qty;
            } else {
                cart.push({
                    id: productId,
                    qty
                });
            }
            saveCart();
            showToast(`${p.name} added to cart!`, 'success');
        }

        function toggleWishlist(productId) {
            const idx = wishlist.indexOf(productId);
            if (idx > -1) {
                wishlist.splice(idx, 1);
            } else {
                wishlist.push(productId);
            }
            saveWishlist();
            const p = PRODUCTS.find(pr => pr.id === productId);
            showToast(wishlist.includes(productId) ? `${p.name} added to wishlist` : `Removed from wishlist`, 'info');
            renderProduct(); // re-render to update heart
        }

        function renderStars(rating) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5 ? 1 : 0;
            const empty = 5 - full - half;
            return `${'<i data-lucide="star" class="w-4 h-4 text-yellow-400 fill-yellow-400"></i>'.repeat(full)}${half ? '<i data-lucide="star-half" class="w-4 h-4 text-yellow-400 fill-yellow-400"></i>' : ''}${'<i data-lucide="star" class="w-4 h-4 text-gray-300"></i>'.repeat(empty)}`;
        }

        function switchTab(tab) {
            ['desc', 'specs', 'reviews'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('tab-active', t === tab);
                document.getElementById(`tab-content-${t}`).classList.toggle('hidden', t !== tab);
            });
        }

                    ${p.img ? `<img src="${p.img}" alt="${p.name}" class="max-w-full max-h-full object-contain">` : `<i data-lucide="${p.icon || 'box'}" class="w-32 h-32 text-gray-300"></i>`}
                </div>
                ${p.img ? `<div class="grid grid-cols-4 gap-2">
                    ${[1,2,3,4].map(i => `<div class="bg-white rounded-lg border-2 ${i===1?'border-blue-500':'border-gray-200 hover:border-gray-300'} overflow-hidden aspect-square flex items-center justify-center p-2 cursor-pointer">
                        <img src="${p.img}" alt="" class="max-w-full max-h-full object-contain ${i!==1?'opacity-60':''}">
                    </div>`).join('')}
                </div>` : ''}
            </div>

            <!-- Info Section -->
            <div class="md:w-1/2">
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-xs text-blue-600 font-semibold uppercase tracking-wider">${catLabel}</span>
                    ${p.badge ? `<span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded">${p.badge}</span>` : ''}
                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 mb-3">${p.name}</h1>
                
                <!-- Rating -->
                <div class="flex items-center gap-2 mb-4">
                    <div class="flex items-center gap-0.5">${renderStars(p.rating)}</div>
                    <span class="text-sm font-semibold text-gray-900">${p.rating}</span>
                    <span class="text-sm text-gray-400">(${p.reviews.toLocaleString()} reviews)</span>
                </div>

                <!-- Price -->
                <div class="flex items-baseline gap-3 mb-6">
                    <span class="text-4xl font-extrabold ${p.salePrice ? 'text-red-600' : 'text-gray-900'}">$${price.toFixed(2)}</span>
                    ${p.salePrice ? `<span class="text-xl text-gray-400 line-through">$${p.price.toFixed(2)}</span><span class="bg-red-100 text-red-700 text-sm font-bold px-2 py-1 rounded">Save $${(p.price - p.salePrice).toFixed(2)}</span>` : ''}
                </div>

                <p class="text-gray-600 mb-6 leading-relaxed">${p.desc.substring(0, 200)}...</p>

                <!-- Color -->
                ${p.color ? `<div class="mb-6">
                    <span class="text-sm font-semibold text-gray-500">Color:</span>
                    <span class="text-sm font-bold text-gray-900 ml-1">${p.color}</span>
                </div>` : ''}

                <!-- Stock Status -->
                <div class="flex items-center gap-2 mb-6 ${p.stock ? 'text-green-600' : 'text-red-600'}">
                    <i data-lucide="${p.stock ? 'check-circle' : 'x-circle'}" class="w-5 h-5"></i>
                    <span class="text-sm font-semibold">${p.stock ? 'In Stock — Ready to Ship' : 'Out of Stock'}</span>
                </div>

                <!-- Quantity Selector -->
                <div class="flex items-center gap-4 mb-6">
                    <span class="text-sm font-semibold text-gray-500">Quantity:</span>
                    <div class="flex items-center border border-gray-300 rounded-lg overflow-hidden">
                        <button onclick="changeQty(-1)" class="px-4 py-2 hover:bg-gray-100 border-r border-gray-300 text-gray-600 transition-colors">
                            <i data-lucide="minus" class="w-4 h-4"></i>
                        </button>
                        <span id="qty-display" class="w-14 text-center font-bold text-lg">1</span>
                        <button onclick="changeQty(1)" class="px-4 py-2 hover:bg-gray-100 border-l border-gray-300 text-gray-600 transition-colors">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3 mb-6">
                    <button onclick="addToCart(${p.id}, selectedQty)" class="flex-grow bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i> Add to Cart
                    </button>
                    <button onclick="toggleWishlist(${p.id})" class="border-2 ${isWished ? 'border-red-300 bg-red-50' : 'border-gray-300 hover:border-red-300 hover:bg-red-50'} p-4 rounded-lg transition-all" title="Add to Wishlist">
                        <i data-lucide="heart" class="w-5 h-5 ${isWished ? 'heart-active' : 'text-gray-400'}"></i>
                    </button>
                </div>

                <!-- Buy Now -->
                <button onclick="addToCart(${p.id}, selectedQty); window.location.href='shoppingcart.html'" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 rounded-lg transition-colors mb-8">
                    Buy Now
                </button>

                <!-- Quick Info -->
                <div class="grid grid-cols-2 gap-4 p-4 bg-gray-50 rounded-xl">
                    <div class="flex items-center gap-3"><div class="bg-blue-100 text-blue-600 p-2 rounded-lg"><i data-lucide="truck" class="w-4 h-4"></i></div><div><div class="text-xs text-gray-500">Shipping</div><div class="text-sm font-semibold">Free over $100</div></div></div>
                    <div class="flex items-center gap-3"><div class="bg-green-100 text-green-600 p-2 rounded-lg"><i data-lucide="shield-check" class="w-4 h-4"></i></div><div><div class="text-xs text-gray-500">Warranty</div><div class="text-sm font-semibold">2 Year Coverage</div></div></div>
                    <div class="flex items-center gap-3"><div class="bg-orange-100 text-orange-600 p-2 rounded-lg"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></div><div><div class="text-xs text-gray-500">Returns</div><div class="text-sm font-semibold">30-Day Free</div></div></div>
                    <div class="flex items-center gap-3"><div class="bg-purple-100 text-purple-600 p-2 rounded-lg"><i data-lucide="lock" class="w-4 h-4"></i></div><div><div class="text-xs text-gray-500">Payment</div><div class="text-sm font-semibold">Secure SSL</div></div></div>
                </div>
            </div>
        `;

        // Tab content
        document.getElementById('tab-content-desc').innerHTML = `
            <div class="prose max-w-none">
                <p class="text-gray-600 leading-relaxed text-lg">${p.desc}</p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
                    <div class="bg-blue-50 p-6 rounded-xl text-center"><i data-lucide="shield-check" class="w-8 h-8 text-blue-600 mx-auto mb-3"></i><h4 class="font-bold text-gray-900 mb-1">Quality Guaranteed</h4><p class="text-sm text-gray-500">Every product tested and certified</p></div>
                    <div class="bg-green-50 p-6 rounded-xl text-center"><i data-lucide="truck" class="w-8 h-8 text-green-600 mx-auto mb-3"></i><h4 class="font-bold text-gray-900 mb-1">Fast Delivery</h4><p class="text-sm text-gray-500">Ships within 24 hours</p></div>
                    <div class="bg-purple-50 p-6 rounded-xl text-center"><i data-lucide="headphones" class="w-8 h-8 text-purple-600 mx-auto mb-3"></i><h4 class="font-bold text-gray-900 mb-1">Expert Support</h4><p class="text-sm text-gray-500">24/7 technical assistance</p></div>
                </div>
            </div>`;

        document.getElementById('tab-content-specs').innerHTML = `
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <table class="w-full">
                    ${Object.entries(p.specs).map(([k, v], i) => `<tr class="${i % 2 === 0 ? 'bg-gray-50' : 'bg-white'}"><td class="px-6 py-3 text-sm font-semibold text-gray-500 w-1/3">${k}</td><td class="px-6 py-3 text-sm font-bold text-gray-900">${v}</td></tr>`).join('')}
                </table>
            </div>`;

        document.getElementById('tab-content-reviews').innerHTML = `
            <div class="space-y-6">
                <div class="flex items-center gap-6 p-6 bg-white rounded-xl border border-gray-200">
                    <div class="text-center"><div class="text-5xl font-extrabold text-gray-900">${p.rating}</div><div class="flex gap-0.5 mt-1">${renderStars(p.rating)}</div><div class="text-sm text-gray-500 mt-1">${p.reviews.toLocaleString()} reviews</div></div>
                    <div class="flex-grow space-y-2">
                        ${[5,4,3,2,1].map(star => { const pct = star === 5 ? 65 : star === 4 ? 20 : star === 3 ? 10 : star === 2 ? 3 : 2; return `<div class="flex items-center gap-2"><span class="text-xs w-4 text-gray-500">${star}</span><i data-lucide="star" class="w-3 h-3 text-yellow-400 fill-yellow-400"></i><div class="flex-grow bg-gray-200 rounded-full h-2"><div class="bg-yellow-400 rounded-full h-2" style="width:${pct}%"></div></div><span class="text-xs text-gray-400 w-8">${pct}%</span></div>`; }).join('')}
                    </div>
                </div>
                ${[{name:"Alex M.", date:"Feb 2026", stars:5, text:"Absolutely incredible quality. Worth every penny. Setup was easy and performance exceeds expectations."},{name:"Jordan K.", date:"Jan 2026", stars:4, text:"Great product overall. Shipping was fast and packaging was excellent. Minor learning curve but nothing major."},{name:"Sam R.", date:"Dec 2025", stars:5, text:"Best purchase I've made all year. The build quality is outstanding and customer support was very helpful."}].map(r => `
                    <div class="bg-white rounded-xl border border-gray-200 p-6">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-sm">${r.name[0]}</div>
                                <div><div class="font-semibold text-gray-900">${r.name}</div><div class="text-xs text-gray-500">${r.date}</div></div>
                            </div>
                            <div class="flex gap-0.5">${renderStars(r.stars)}</div>
                        </div>
                        <p class="text-gray-600">${r.text}</p>
                    </div>`).join('')}
            </div>`;

        // Related products
        const related = PRODUCTS.filter(pr => pr.category === p.category && pr.id !== p.id).slice(0, 4);
        const extraNeeded = 4 - related.length;
        if (extraNeeded > 0) {
            const extras = PRODUCTS.filter(pr => pr.id !== p.id && !related.find(r => r.id === pr.id)).slice(0, extraNeeded);
            related.push(...extras);
        }
        document.getElementById('related-products').innerHTML = related.map(rp => {
            const rpPrice = rp.salePrice || rp.price;
            return `<a href="product.html?id=${rp.id}" class="border border-gray-200 rounded-lg p-4 hover-card bg-white no-underline block">
                ${rp.badge ? `<span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded inline-block mb-2">${rp.badge}</span>` : ''}
                <div class="bg-gray-100 rounded mb-3 h-36 flex items-center justify-center overflow-hidden">
                    ${rp.img ? `<img src="${rp.img}" class="h-full object-contain" alt="${rp.name}">` : `<i data-lucide="${rp.icon || 'box'}" class="w-10 h-10 text-gray-300"></i>`}
                </div>
                <h3 class="font-semibold text-gray-900 text-sm truncate">${rp.name}</h3>
                <p class="text-xs text-gray-500 mb-2">${rp.category.replace('-', ' ')}</p>
                <span class="font-bold text-lg ${rp.salePrice ? 'text-red-600' : 'text-gray-900'}">$${rpPrice.toFixed(2)}</span>
                ${rp.salePrice ? `<span class="text-xs text-gray-400 line-through ml-1">$${rp.price.toFixed(2)}</span>` : ''}
            </a>`;
        }).join('');

        lucide.createIcons();
    }

    function changeQty(delta) {
        selectedQty = Math.max(1, Math.min(99, selectedQty + delta));
        document.getElementById('qty-display').textContent = selectedQty;
    }

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        updateCartBadge();
        renderProduct();
    });
    </script>
</body>

</html>
